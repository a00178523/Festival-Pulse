server:
  port: 8081

spring:
  application:
    name: Festival Pulse
  datasource:
    url: jdbc:h2:mem:festivalpulse;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true

springdoc:
  api-docs:
    version: openapi_3_0
